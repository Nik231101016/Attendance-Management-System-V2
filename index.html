<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX — Login</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-bg"></div>

    <div class="login-card">
        <div class="login-logo">
            <div class="logo-mark">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>
            <h1>AttendX</h1>
            <p>Attendance Management System</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" required placeholder="Enter username" autocomplete="off" spellcheck="false">
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
            </div>

            <p class="input-label-sub">Quick select role</p>
            <div class="role-cards">
                <div class="role-card" data-role="student" onclick="selectRole('student')">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Student</span>
                </div>
                <div class="role-card" data-role="admin" onclick="selectRole('admin')">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Admin</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <p class="login-hint">Type "student" or "admin" as username — any password works</p>
        </form>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
